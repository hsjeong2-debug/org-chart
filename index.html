<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>더파운더즈 · 조직도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root {
  --bg: #FFFFFF;
  --panel: #FFFFFF;
  --canvas-bg: #F8FAFC;
  --ink: #0F172A;
  --ink-muted: #64748B;
  --border: #E2E8F0;
  --border-strong: #CBD5E1;
  --hover: #F1F5F9;
  --accent: #2563EB;
  --header-dark: #1E293B;
  --badge-blue:   #DAE7F4;
  --badge-pink:   #FCDDE3;
  --badge-yellow: #F5EAB6;
  --badge-green:  #DFF0BF;
  --leader-bg: #E5E7EB;
  --acting-bg: #E5E7EB;
  --regular-bg: #FFFFFF;
  --contract-bg: #FFFFFF;
  --dispatch-bg: #FFFFFF;
  --leave-bg: #F1F5F9;
  --joining-bg: #EFF6FF;
  --leave-ink: #7C4A0F;
  --line: #CBD5E1;
  --dot-regular: var(--badge-blue);
  --dot-contract: var(--badge-pink);
  --dot-dispatch: var(--badge-yellow);
  --dot-leader: var(--badge-green);
  --dot-female: #F5E4EC;
  --dot-male: #DCE6F0;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
}

.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 14px 22px; display: flex; align-items: center; gap: 22px;
}
.topbar h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
.topbar .meta { color: var(--ink-muted); font-size: 12px; display: flex; gap: 14px; }
.topbar .meta b { color: var(--ink); font-weight: 600; }
.topbar .spacer { flex: 1; }
.topbar .search {
  border: 1px solid var(--border-strong); border-radius: 999px;
  padding: 6px 12px; font-size: 12.5px; width: 240px; outline: none;
  background: var(--canvas-bg); font-family: inherit;
}
.topbar .search:focus { border-color: var(--ink); background: var(--panel); }
.topbar .zoom { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); }
.topbar .zoom button {
  border: 1px solid var(--border-strong); background: var(--panel);
  width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
  font-size: 14px; line-height: 1; font-family: inherit;
}
.topbar .zoom button:hover { border-color: var(--ink); }
.topbar .zoom .fit { width: auto; padding: 0 8px; font-size: 11px; }

.layout { display: flex; height: calc(100vh - 92px); }
.sidebar {
  width: 224px; flex-shrink: 0;
  background: var(--panel); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 14px 12px 24px;
  transition: width 200ms ease, padding 200ms ease, border 200ms ease;
}
.sidebar.hidden { width: 0; padding: 0; overflow: hidden; border-right: none; }
#sidebar-toggle {
  border: 1px solid var(--border-strong); background: var(--panel);
  width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
  font-size: 15px; line-height: 1; font-family: inherit; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-muted);
}
#sidebar-toggle:hover { border-color: var(--ink); color: var(--ink); }
.sidebar h4 {
  margin: 12px 0 6px; font-size: 10px; font-weight: 700;
  color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em;
  padding: 5px 4px;
}
.sidebar h4:first-of-type { margin-top: 0; }
.stat-header { cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between; }
.stat-header .toggle-icon { font-size: 10px; transition: transform 150ms; }
.stat-header.collapsed .toggle-icon { transform: rotate(-90deg); }
.stat-section.collapsed { display: none; }
.stat-row {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 8px; border-radius: 5px; font-size: 12.5px;
  transition: background 100ms;
}
.stat-row:hover { background: var(--hover); }
.stat-row .label { flex: 1; color: var(--ink); }
.stat-row .value { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.stat-row .badge {
  display: inline-block; min-width: 22px; text-align: center;
  padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: 700;
  background: #E2E8F0; color: var(--ink); line-height: 15px;
}
.stat-row .badge.L { background: var(--badge-green); color: #3F5A15; }
.stat-row .badge.S, .stat-row .badge.M, .stat-row .badge.PA { background: var(--badge-blue); }
.stat-row .badge.ASSIST { background: var(--badge-yellow); color: var(--ink); }
.stat-row .badge.JINT { background: var(--badge-pink); color: var(--ink); }
.stat-row .badge.DINT, .stat-row .badge.PT { background: #EDE9FE; color: var(--ink); }
.stat-row .badge.INT, .stat-row .badge.ASSIST { font-size: 9px; }
.stat-row .dot {
  width: 12px; height: 12px; border-radius: 3px;
  border: 1px solid var(--border-strong); flex-shrink: 0;
}
.stat-row .dot.regular  { background: var(--dot-regular); }
.stat-row .dot.contract { background: var(--dot-contract); }
.stat-row .dot.dispatch { background: var(--dot-dispatch); }
.stat-row .dot.leader   { background: var(--dot-leader); border-color: #B0C88C; }
.stat-row .dot.grey     { background: #E2E8F0; border-color: #CBD5E1; }
.stat-row .dot.leave    { background: var(--leave-bg); }
.stat-row .dot.joining  { background: var(--joining-bg); border-color: #93C5FD; }
.stat-row .dot.female   { background: var(--dot-female); border-color: #D4A5BE; }
.stat-row .dot.male     { background: var(--dot-male); border-color: #93A9C3; }
.stat-total {
  padding: 10px 12px; background: var(--canvas-bg); border-radius: 8px; margin-bottom: 4px;
}
.stat-total .big { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat-total .lbl { font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.stat-total .split { display: flex; gap: 10px; margin-top: 6px; font-size: 11px; color: var(--ink-muted); flex-wrap: wrap; }
.stat-total .split b { color: var(--ink); font-weight: 600; }

.canvas { flex: 1; position: relative; overflow: auto; padding: 30px; background: var(--canvas-bg); }
.tree-inner { position: relative; transform-origin: 0 0; }

#loading-overlay {
  position: fixed; inset: 0; background: var(--canvas-bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 200; gap: 10px;
}
#loading-overlay .loading-text { font-size: 13px; color: var(--ink-muted); }
#loading-overlay .loading-error { color: #DC2626; font-size: 13px; text-align: center; line-height: 1.6; }

.node {
  position: absolute; width: 200px;
  background: var(--panel); border: 1px solid var(--border-strong);
  border-radius: 6px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  transition: box-shadow 120ms;
}
.node:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); z-index: 3; }
.node.root { width: 240px; }

.node .head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 9px; color: #fff;
  background: var(--header-dark);
  border-bottom: 1px solid rgba(0,0,0,0.15);
  gap: 6px;
}
.node .head .name {
  font-size: 12px; font-weight: 900; letter-spacing: -0.01em;
  white-space: normal; word-break: keep-all;
  flex: 1; min-width: 0; line-height: 1.3;
}
.node .head .counts { display: flex; gap: 3px; align-items: center; flex-shrink: 0; }
.node .head .counts .direct,
.node .head .counts .total {
  font-size: 10.5px; padding: 0 5px; border-radius: 999px; line-height: 15px;
  background: rgba(255,255,255,0.15); color: #fff; font-variant-numeric: tabular-nums;
}
.node .head .counts .total { background: rgba(255,255,255,0.28); font-weight: 600; }
.node .head .counts .sep { color: rgba(255,255,255,0.5); font-size: 9.5px; }

.node .section-label {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-muted); padding: 3px 9px 0; font-weight: 600;
}

.person-row {
  display: flex; align-items: center; gap: 6px; padding: 2.5px 9px;
  border-bottom: 1px solid var(--border);
  position: relative; font-size: 12.5px;
}
.person-row:last-child { border-bottom: none; }

.person-row.member.regular  { background: var(--regular-bg); }
.person-row.member.contract { background: var(--contract-bg); }
.person-row.member.dispatch { background: var(--dispatch-bg); }
.person-row.leader,
.person-row.leader.regular,
.person-row.leader.contract,
.person-row.leader.dispatch { background: var(--leader-bg); }
.person-row.on-leave { background: var(--leave-bg) !important; color: var(--ink-muted); }
.person-row.on-leave .name  { color: var(--ink-muted); }
.person-row.on-leave .name::after { content: " ·"; opacity: 0.5; font-weight: 400; margin-left: 2px; }
.person-row.on-joining { background: var(--joining-bg) !important; }
.person-row.on-joining .name { color: var(--ink); }
.person-row.on-retiring { background: var(--leave-bg) !important; color: var(--ink-muted); }
.person-row.on-retiring .name { color: var(--ink-muted); }

.person-row.leader .role {
  font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 3px;
  background: var(--badge-green); color: var(--ink);
  white-space: nowrap; line-height: 15px;
}
.person-row.leader .name { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; min-width: 0; }

.person-row.member .code {
  min-width: 26px; text-align: center; padding: 0 4px; border-radius: 3px;
  font-size: 10px; font-weight: 700; color: var(--ink);
  background: var(--badge-blue); line-height: 15px; white-space: nowrap;
}
/* 코드 뱃지: 직책 기준 색상 */
.person-row.member .code[data-code="(전)인턴"] { background: var(--badge-pink); }
.person-row.member .code[data-code="어시"] { background: var(--badge-yellow); }
.person-row.member .code[data-code="(단)인턴"],
.person-row.member .code[data-code="PT"] { background: #EDE9FE; color: var(--ink); }
/* S/M/PA + 계약/파견 suffix는 data-code가 여전히 S/M/PA이므로 기본 파랑 유지 */
.person-row.member .name { flex: 1; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; min-width: 0; }
.person-row.has-tag { padding-right: 76px; }
.geum-tag {
  font-size: 8.5px; color: var(--ink-muted); font-weight: 700;
  padding: 0 3px; border-radius: 2px; background: #E2E8F0;
  white-space: nowrap; line-height: 15px; flex-shrink: 0;
}

[data-tip] { cursor: help; }
[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute; z-index: 100;
  left: 50%; top: 100%; transform: translate(-50%, 4px);
  background: #1F1F23; color: #F7F5F0;
  padding: 6px 10px; border-radius: 5px;
  font-size: 10.5px; font-weight: 500; white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  pointer-events: none;
}
[data-tip]:hover::before {
  content: ''; position: absolute; z-index: 100;
  left: 50%; top: 100%; transform: translate(-50%, 0);
  border: 4px solid transparent; border-bottom-color: #1F1F23;
  pointer-events: none;
}

.node.dimmed { opacity: 0.28; }
.node.highlight { border-color: var(--ink); box-shadow: 0 6px 20px rgba(0,0,0,0.12); z-index: 4; }
.person-row.match { outline: 2px solid var(--accent); outline-offset: -2px; }

.connectors { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.connectors path { fill: none; stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }

/* 파트 직렬 임베드 섹션 헤더 */
.child-section-header {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 5px 9px 4px; color: #fff;
  background: #1A6070;
  border-top: 1px solid rgba(0,0,0,0.12);
}
.child-section-header .child-name {
  font-size: 11.5px; font-weight: 700; letter-spacing: -0.01em;
  white-space: normal; word-break: keep-all; flex: 1; line-height: 1.3;
}
.child-section-header .child-counts {
  font-size: 10px; padding: 0 5px; border-radius: 999px; line-height: 15px;
  background: rgba(255,255,255,0.22); font-variant-numeric: tabular-nums; flex-shrink: 0;
}

/* ── 탭 바 ── */
.tab-bar {
  display: flex; align-items: center;
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 0 14px; gap: 2px; flex-shrink: 0;
}
.tab-btn {
  padding: 7px 16px; font-size: 12.5px; font-family: inherit;
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--ink-muted); cursor: pointer; margin-bottom: -1px;
  transition: color 120ms, border-color 120ms;
}
.tab-btn.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tab-btn:hover:not(.active) { color: var(--ink); }
.version-wrap { display: flex; align-items: center; gap: 8px; margin-left: 16px; }
.version-label { font-size: 11.5px; color: var(--ink-muted); white-space: nowrap; }
.version-input {
  border: 1px solid var(--border-strong); border-radius: 6px;
  padding: 3px 9px; font-family: inherit; font-size: 12px;
  background: var(--canvas-bg); color: var(--ink); outline: none; width: 200px;
}
.version-input:focus { border-color: var(--ink); }

/* ── 초안 편집 모드 CSS ── */
.draft-topbar-btns {
  display: none; align-items: center; gap: 6px;
}
body.edit-mode .draft-topbar-btns { display: flex; }

.draft-banner {
  background: #D97706; color: #fff;
  font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 4px;
  white-space: nowrap; flex-shrink: 0;
  display: none;
}
body.edit-mode .draft-banner { display: block; }

.node .draft-card-controls {
  display: none; gap: 3px; z-index: 20; flex-shrink: 0;
}
body.edit-mode .node:hover .draft-card-controls { display: flex; }
.draft-card-btn {
  font-size: 10px; font-weight: 700; border-radius: 3px;
  padding: 1px 5px; cursor: pointer; line-height: 14px;
  white-space: nowrap; border: none; font-family: inherit;
}
.draft-card-btn.cb-remove { background: rgba(239,68,68,0.85); color: #fff; }
.draft-card-btn.cb-move   { background: rgba(255,255,255,0.28); color: #fff; }
.draft-card-btn.cb-add    { background: rgba(255,255,255,0.28); color: #fff; }
.draft-card-btn:hover { opacity: 0.8; }

.draft-insert-line {
  height: 2px; background: #3B82F6; margin: 0 6px;
  border-radius: 2px; pointer-events: none; flex-shrink: 0;
}

.draft-org-badge {
  font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 3px; white-space: nowrap;
}
.draft-org-badge.will-remove { background: #FEE2E2; color: #B91C1C; }
.draft-org-badge.will-move   { background: #FEF3C7; color: #92400E; }
.draft-org-badge.is-new      { background: #D1FAE5; color: #065F46; }

.draft-btn {
  border: 1px solid var(--border-strong); background: var(--panel);
  height: 28px; border-radius: 6px; cursor: pointer;
  font-size: 11.5px; font-family: inherit; padding: 0 10px;
  color: var(--ink); white-space: nowrap;
}
.draft-btn:hover { border-color: var(--ink); }
.draft-btn.primary { background: #1E40AF; color: #fff; border-color: #1E40AF; }
.draft-btn.primary:hover { background: #1D4ED8; }

.person-row .draft-remove {
  display: none; position: absolute; right: 5px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px; border-radius: 50%;
  background: #EF4444; color: #fff;
  font-size: 11px; font-weight: 700; line-height: 16px;
  text-align: center; cursor: pointer; z-index: 10;
}
body.edit-mode .person-row:hover .draft-remove { display: block; }
body.edit-mode .person-row.has-tag:hover .draft-remove { right: 82px; }

.draft-add-row {
  display: none; align-items: center; justify-content: center;
  padding: 5px 9px; cursor: pointer;
  color: var(--ink-muted); font-size: 11px;
  border-top: 1px solid var(--border);
}
body.edit-mode .draft-add-row { display: flex; }
.draft-add-row:hover { background: var(--hover); color: var(--ink); }

.node.drag-over { outline: 2px dashed #3B82F6; outline-offset: -2px; }
.person-row.dragging { opacity: 0.35; }

.node .head .draft-rename-input {
  font: inherit; font-weight: 900; letter-spacing: -0.01em;
  background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.6);
  border-radius: 3px; padding: 0 3px; color: #fff; width: 100%; outline: none;
}

#draft-modal {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.45);
  align-items: center; justify-content: center;
}
#draft-modal-box {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 22px 24px; min-width: 300px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
#draft-modal-box h3 { margin: 0 0 16px; font-size: 14px; font-weight: 700; }
#draft-modal-box label {
  display: flex; flex-direction: column; gap: 4px;
  font-size: 11.5px; color: var(--ink-muted); margin-bottom: 10px;
}
#draft-modal-box input, #draft-modal-box select {
  border: 1px solid var(--border-strong); border-radius: 6px;
  padding: 6px 8px; font-family: inherit; font-size: 13px;
  background: var(--canvas-bg); color: var(--ink); outline: none;
}
#draft-modal-box input:focus, #draft-modal-box select:focus { border-color: var(--ink); }
.draft-modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
#draft-org-modal {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.45); align-items: center; justify-content: center;
}
</style>
</head>
<body>

<div class="topbar">
  <button id="sidebar-toggle" title="사이드바 숨기기/보이기">☰</button>
  <h1>더파운더즈 · 조직도</h1>
  <div class="meta">
    <span>기준일 <b>2026.09.15</b></span>
  </div>
  <div class="spacer"></div>
  <input type="search" class="search" placeholder="이름 또는 조직 검색…" id="search">
  <div class="zoom">
    <button id="zoom-out">−</button>
    <span id="zoom-label">100%</span>
    <button id="zoom-in">+</button>
    <button id="zoom-fit" class="fit" title="화면에 맞춤">맞춤</button>
  </div>
  <div class="draft-topbar-btns">
    <button class="draft-btn primary" id="draft-save">저장</button>
    <button class="draft-btn" id="draft-reset" title="모든 변경사항 초기화">초기화</button>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-view">조직도</button>
  <button class="tab-btn" id="tab-edit">편집</button>
  <div class="version-wrap" id="version-wrap" style="display:none">
    <span class="version-label">버전명</span>
    <input type="text" id="version-name" class="version-input" placeholder="예: 2026 Q3 개편안">
  </div>
</div>

<div id="draft-modal">
  <div id="draft-modal-box">
    <h3>인원 추가 — <span id="draft-modal-org" style="font-weight:400;color:var(--ink-muted)"></span></h3>
    <label>이름
      <input id="draft-new-name" type="text" placeholder="홍길동">
    </label>
    <label>직책
      <select id="draft-new-title">
        <option>팀 리더</option><option>파트 리더</option>
        <option selected>매니저</option><option>Sr.매니저</option>
        <option>스페셜리스트</option><option>어시스턴트</option>
        <option>전환인턴</option><option>단기인턴</option><option>시간제근로자</option>
      </select>
    </label>
    <label>고용형태
      <select id="draft-new-contract">
        <option>정규직</option><option>계약직</option><option>파견직</option>
      </select>
    </label>
    <div class="draft-modal-btns">
      <button class="draft-btn" id="draft-modal-cancel">취소</button>
      <button class="draft-btn primary" id="draft-modal-confirm">추가</button>
    </div>
  </div>
</div>

<div id="draft-org-modal">
  <div id="draft-modal-box" style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px 24px;min-width:300px;box-shadow:0 8px 32px rgba(0,0,0,0.2);">
    <h3 id="draft-org-modal-title" style="margin:0 0 16px;font-size:14px;font-weight:700;"></h3>
    <label style="display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-muted);margin-bottom:10px;">
      <span id="draft-org-modal-label"></span>
      <input id="draft-org-input" type="text" style="border:1px solid var(--border-strong);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:13px;background:var(--canvas-bg);color:var(--ink);outline:none;">
    </label>

<div id="loading-overlay">
  <div class="loading-text" id="loading-msg">조직도 데이터를 불러오는 중…</div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="stat-total">
      <div class="lbl">총 인원</div>
      <div class="big" id="stat-total">–</div>
      <div class="split">
        <span>재직 <b id="stat-active">–</b></span>
        <span>휴직 <b id="stat-leave">–</b></span>

      </div>

    <h4 class="stat-header" data-target="stats-position">직책별 <span class="toggle-icon">▾</span></h4>

    <h4 class="stat-header" data-target="stats-contract">고용형태별 <span class="toggle-icon">▾</span></h4>

    <h4 class="stat-header" data-target="stats-gender">성별 <span class="toggle-icon">▾</span></h4>

  <div class="canvas" id="canvas">
    <div class="tree-inner" id="tree">
      <svg class="connectors" id="svg"></svg>
    </div>
  </div>

<script>
const _BAKED = null;           // static build: JSON object / dynamic build: null
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzazHJZN5uWZIfFttOwqpTnPlwEJtMFxFkGz44QriNp3XvxQNrn7hNeTvXlfpGPk3Grog/exec';
let DATA = null;

const CARD_W      = 200;
const CARD_W_ROOT = 240;
// 트리상 depth가 낮지만 시각적으로 강제할 최소 depth 지정
const FORCE_DEPTH = {
  '디자인 1팀':2,'디자인 2팀':2,'프로젝트21팀':2,'법무팀':2,'커뮤니케이션팀':2,
};
// 자녀가 모두 리프여도 임베드하지 않을 조직
const NO_AUTO_EMBED = new Set(['재무실']);
const INTRA_GAP   = 10;
const OUTER_PAD   = 16;
const V_GAP       = 4;
const V_GAP_PER_DEPTH = [20, 76, 4, 4]; // CEO→그룹, 그룹→본부, 본부→팀, 팀→...
function vGap(fromDepth) { return V_GAP_PER_DEPTH[fromDepth] !== undefined ? V_GAP_PER_DEPTH[fromDepth] : V_GAP; }
const LINE_TAIL   = 4;

function estimateCardHeight(node) {
  const containerBorder = 2;
  const headerH      = 30;
  const secLabelH    = 18;
  const leaderRowH   = 23;
  const memberRowH   = 22;
  const childHdrH    = 28;  // child-section-header
  function sectionH(n) {
    const nL = (n.leaders ? n.leaders.length : 0);
    const nM = (n.members ? n.members.length : 0);
    return (nL > 0 ? secLabelH + nL * leaderRowH : 0)
         + (nM > 0 ? secLabelH + nM * memberRowH : 0);
  }
  let h = containerBorder + headerH + sectionH(node);
  if (node._embedChildren && node.children) {
    node.children.forEach(c => { h += childHdrH + sectionH(c); });
  }
  return h + 4;
}

function calcSubtreeWidth(node, isRoot) {
  const cardW = isRoot ? CARD_W_ROOT : CARD_W;
  if (!node.children || node.children.length === 0) {
    node._selfW = cardW; node._subtreeW = cardW; return cardW;
  }
  // 파트 직렬 임베드: 모든 자식이 리프 노드이면 부모 카드 안에 섹션으로 내장
  const allLeaves = node.children.every(c => !c.children || c.children.length === 0);
  const hasForced = node.children.some(c => FORCE_DEPTH[c.name] !== undefined);
  if (allLeaves && !NO_AUTO_EMBED.has(node.name) && !hasForced) {
    node._embedChildren = true;
    node.children.forEach(c => { c._embedded = true; c._selfW = 0; c._subtreeW = 0; });
    node._selfW = cardW; node._subtreeW = cardW; return cardW;
  }
  let innerW = 0;
  node.children.forEach((c, i) => { if (i > 0) innerW += INTRA_GAP; innerW += calcSubtreeWidth(c, false); });
  node._selfW = cardW;
  node._subtreeW = Math.max(cardW, innerW + 2 * OUTER_PAD);
  return node._subtreeW;
}

function assignX(node, subtreeStartX, isRoot) {
  if (node._embedded) return;
  const cardW    = node._selfW;
  const subtreeW = node._subtreeW;
  node.x = subtreeStartX + (subtreeW - cardW) / 2;
  if (!node.children || node.children.length === 0 || node._embedChildren) return;
  let innerW = 0;
  node.children.forEach((c, i) => { if (i > 0) innerW += INTRA_GAP; innerW += c._subtreeW; });
  let childX = subtreeStartX + (subtreeW - innerW) / 2;
  node.children.forEach(c => { assignX(c, childX, false); childX += c._subtreeW + INTRA_GAP; });
}

function assignY(node, y, depth, depthMax) {
  if (node._embedded) return;
  node.y = y;
  const h = estimateCardHeight(node);
  depthMax[depth] = Math.max(depthMax[depth] || 0, h);
  if (node.children && !node._embedChildren)
    node.children.forEach(c => assignY(c, 0, depth + 1, depthMax));
}

function finalizeY(node, depth, depthTops) {
  if (node._embedded) return;
  node.y = depthTops[depth];
  if (node.children && !node._embedChildren)
    node.children.forEach(c => finalizeY(c, depth + 1, depthTops));
}

const CONTRACT_CLASS = { '정규직': 'regular', '계약직': 'contract', '파견직': 'dispatch' };

function renderNode(node, isRoot) {
  const el = document.createElement('div');
  el.className = 'node' + (isRoot ? ' root' : '');
  el.style.left = node.x + 'px';
  el.style.top  = node.y + 'px';
  el.dataset.org = node.name;

  const head = document.createElement('div'); head.className = 'head';
  const nameSpan = document.createElement('div'); nameSpan.className = 'name';
  nameSpan.textContent = node.short_name || node.name;
  nameSpan.title = node.name;
  head.appendChild(nameSpan);

  const counts = document.createElement('div'); counts.className = 'counts';
  const dir = document.createElement('span'); dir.className = 'direct'; dir.textContent = node.direct;
  counts.appendChild(dir);
  if (node.total !== node.direct) {
    const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '/';
    counts.appendChild(sep);
    const tot = document.createElement('span'); tot.className = 'total'; tot.textContent = node.total;
    counts.appendChild(tot);
  }
  head.appendChild(counts);
  el.appendChild(head);

  function makePersonRow(p, isLeader) {
    const row = document.createElement('div');
    const classes = ['person-row'];
    classes.push(isLeader ? 'leader' : 'member');
    const cc = CONTRACT_CLASS[p.contract] || 'regular';
    classes.push(cc);
    if (p.leave) {
      classes.push('on-leave');
      classes.push('has-tag');
      const tip = (p.leave.kind || '휴직') + (p.leave.end ? ' · 종료 ' + p.leave.end : '');
      row.setAttribute('data-tip', tip);
    }
    const hasTag = !!(p.retiring || p.joining);
    if (hasTag) classes.push('has-tag');
    if (p.joining) {
      classes.push('on-joining');
    }
    if (p.retiring) {
      classes.push('on-retiring');
    }
    row.className = classes.join(' ');
    row.dataset.name = p.name;

    if (isLeader) {
      const role = document.createElement('span'); role.className = 'role';
      role.textContent = p.kind;
      row.appendChild(role);
    } else {
      const code = document.createElement('span'); code.className = 'code';
      code.dataset.code = p.code;
      code.textContent = p.contract_tag ? p.code + '(' + p.contract_tag + ')' : p.code;
      row.appendChild(code);
    }
    const name = document.createElement('span'); name.className = 'name';
    name.textContent = p.name;
    name.title = p.name;
    row.appendChild(name);
    if (p.geum) {
      const gt = document.createElement('span'); gt.className = 'geum-tag';
      gt.textContent = '겸'; row.appendChild(gt);
    }
    // 퇴직/입사 태그: absolute 우측 정렬 (has-tag로 padding-right 확보)
    if (p.retiring && p.retiring.short) {
      const tag = document.createElement('span');
      tag.style.cssText = 'position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#C0392B;font-size:10.5px;font-weight:500;white-space:nowrap;';
      tag.textContent = '(' + p.retiring.short + ' 퇴직)';
      row.appendChild(tag);
    }
    if (p.joining && p.joining.short) {
      const tag = document.createElement('span');
      tag.style.cssText = 'position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#2563EB;font-size:10.5px;font-weight:500;white-space:nowrap;';
      tag.textContent = '(' + p.joining.short + ' 입사)';
      row.appendChild(tag);
    }
    if (p.leave) {
      const leaveLabel = (p.leave.kind && p.leave.kind.includes('휴가')) ? '휴가' : '휴직';
      const tag = document.createElement('span');
      tag.style.cssText = 'position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#374151;font-size:10.5px;font-weight:500;white-space:nowrap;';
      tag.textContent = '(' + leaveLabel + ')';
      row.appendChild(tag);
    }
    return row;
  }

  if (node.leaders && node.leaders.length > 0) {
    const lbl = document.createElement('div'); lbl.className = 'section-label'; lbl.textContent = '리더';
    el.appendChild(lbl);
    node.leaders.forEach(l => el.appendChild(makePersonRow(l, true)));
  }
  if (node.members && node.members.length > 0) {
    const lbl = document.createElement('div'); lbl.className = 'section-label'; lbl.textContent = '구성원';
    el.appendChild(lbl);
    node.members.forEach(m => el.appendChild(makePersonRow(m, false)));
  }

  // 파트 직렬 임베드: 리프 자식을 섹션 헤더로 카드 안에 삽입
  if (node._embedChildren && node.children) {
    node.children.forEach(child => {
      const hdr = document.createElement('div'); hdr.className = 'child-section-header';
      hdr.dataset.childOrg = child.name;
      const nm = document.createElement('span'); nm.className = 'child-name';
      nm.textContent = child.short_name || child.name; nm.title = child.name;
      hdr.appendChild(nm);
      const cnt = document.createElement('span'); cnt.className = 'child-counts';
      cnt.textContent = child.direct;
      hdr.appendChild(cnt);
      el.appendChild(hdr);
      if (child.leaders && child.leaders.length > 0) {
        const lbl = document.createElement('div'); lbl.className = 'section-label'; lbl.textContent = '리더';
        el.appendChild(lbl);
        child.leaders.forEach(l => el.appendChild(makePersonRow(l, true)));
      }
      if (child.members && child.members.length > 0) {
        const lbl = document.createElement('div'); lbl.className = 'section-label'; lbl.textContent = '구성원';
        el.appendChild(lbl);
        child.members.forEach(m => el.appendChild(makePersonRow(m, false)));
      }
    });
  }

  return el;
}

function renderTree(root) {
  calcSubtreeWidth(root, true);
  assignX(root, OUTER_PAD, true);

  const depthMax = {};
  assignY(root, 0, 0, depthMax);
  const depthTops = {0: 0};
  Object.keys(depthMax).map(Number).sort((a,b)=>a-b).forEach(d => {
    if (d === 0) { depthTops[0] = 0; }
    else { depthTops[d] = depthTops[d-1] + depthMax[d-1] + vGap(d-1); }
  });
  finalizeY(root, 0, depthTops);

  const container = document.getElementById('tree');
  const svg = document.getElementById('svg');

  function walk(node, isRoot) {
    if (node._embedded) return;
    const el = renderNode(node, isRoot);
    container.appendChild(el);
    node._el = el;
    if (node.children && !node._embedChildren) node.children.forEach(c => walk(c, false));
  }
  walk(root, true);

  const LAYOUT_H_CAP = 300;
  const realDepthMax = {};
  function measureDepth(node, depth) {
    if (node._embedded) return;
    const rect = node._el.getBoundingClientRect();
    const fd0 = FORCE_DEPTH[node.name];
    const effDepth = (fd0 !== undefined) ? Math.max(depth, fd0) : depth;
    realDepthMax[effDepth] = Math.max(realDepthMax[effDepth] || 0, Math.min(rect.height, LAYOUT_H_CAP));
    if (node.children && !node._embedChildren) node.children.forEach(c => measureDepth(c, depth + 1));
  }
  measureDepth(root, 0);

  const realDepthTops = {0: 0};
  Object.keys(realDepthMax).map(Number).sort((a,b)=>a-b).forEach(d => {
    if (d === 0) { realDepthTops[0] = 0; }
    else { realDepthTops[d] = realDepthTops[d-1] + realDepthMax[d-1] + vGap(d-1); }
  });

  function repositionY(node, depth) {
    if (node._embedded) return;
    const fd1 = FORCE_DEPTH[node.name];
    const effDepth = (fd1 !== undefined) ? Math.max(depth, fd1) : depth;
    node.y = realDepthTops[effDepth] !== undefined ? realDepthTops[effDepth] : realDepthTops[depth] || 0;
    node._el.style.top = node.y + 'px';
    if (node.children && !node._embedChildren) node.children.forEach(c => repositionY(c, depth + 1));
  }
  repositionY(root, 0);

  let maxX = 0, maxY = 0;
  function measure(node, depth) {
    if (node._embedded) return;
    const fd2 = FORCE_DEPTH[node.name];
    const effDepth = (fd2 !== undefined) ? Math.max(depth, fd2) : depth;
    maxX = Math.max(maxX, node.x + node._selfW);
    maxY = Math.max(maxY, node.y + (realDepthMax[effDepth] || realDepthMax[depth] || 0));
    if (node.children && !node._embedChildren) node.children.forEach(c => measure(c, depth + 1));
  }
  measure(root, 0);
  container.style.width  = (maxX + OUTER_PAD) + 'px';
  container.style.height = (maxY + 40) + 'px';

  svg.setAttribute('width',  maxX + OUTER_PAD);
  svg.setAttribute('height', maxY + 40);

  function drawConnectors(node, depth) {
    if (!node.children || node.children.length === 0 || node._embedChildren) return;
    const visibleKids = node.children.filter(c => !c._embedded);
    if (visibleKids.length === 0) return;
    const parentActualH = node._el.getBoundingClientRect().height;
    const parentBottomY = node.y + parentActualH;
    const parentCX = node.x + node._selfW / 2;

    // 모든 자녀를 동일한 수평 버스에서 분기:
    // normalKids(원래 depth)와 forcedKids(강제 depth-3) 모두 같은 버스 Y에서 시작
    // → normalKids는 짧게 내려가고, forcedKids는 길게 내려가지만 연결 부모가 명확
    const normalKids = visibleKids.filter(c => FORCE_DEPTH[c.name] === undefined);
    const hlineY = normalKids.length > 0
      ? normalKids[0].y - LINE_TAIL
      : parentBottomY + LINE_TAIL;

    const allCXs = visibleKids.map(c => c.x + c._selfW / 2);
    const minX   = Math.min(...allCXs, parentCX);
    const maxX2  = Math.max(...allCXs, parentCX);

    let d = `M ${parentCX} ${parentBottomY} V ${hlineY}`;
    d += ` M ${minX} ${hlineY} H ${maxX2}`;
    visibleKids.forEach(c => {
      const kx = c.x + c._selfW / 2;
      d += ` M ${kx} ${hlineY} V ${c.y}`;
    });

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d); svg.appendChild(path);
    visibleKids.forEach(c => drawConnectors(c, depth + 1));
  }
  drawConnectors(root, 0);
}

function computeStats(root) {
  const stats = {
    total: 0, active: 0, leave: 0, joining: 0, orgs: 0,
    position: {'L':0,'S':0,'M':0,'PA':0,'어시':0,'(전)인턴':0,'(단)인턴':0,'PT':0},
    contract: {'정규직':0,'계약직':0,'파견직':0,'기타':0},
    gender: {'여성':0,'남성':0,'미지정':0},
  };
  function tally(p, isLeader) {
    if (p.joining) { stats.joining++; return; }
    if (p.geum)    { return; }   // 겸직 — 주조직에서 이미 집계
    stats.total++;
    if (p.leave) stats.leave++; else stats.active++;
    if (isLeader) stats.position['L']++;
    else stats.position[p.code] = (stats.position[p.code] || 0) + 1;
    if (['정규직','계약직','파견직'].includes(p.contract)) stats.contract[p.contract]++;
    else stats.contract['기타']++;
    if (p.gender === '여성' || p.gender === '남성') stats.gender[p.gender]++;
    else stats.gender['미지정']++;
  }
  function walk(n) {
    stats.orgs++;
    (n.leaders || []).forEach(p => tally(p, true));
    (n.members || []).forEach(p => tally(p, false));
    (n.children || []).forEach(walk);
  }
  walk(root);
  return stats;
}

function statRow(badgeClass, badgeText, label, value, badgeStyle) {
  const row = document.createElement('div'); row.className = 'stat-row';
  if (badgeStyle === 'dot') {
    const dot = document.createElement('span'); dot.className = 'dot ' + badgeClass;
    row.appendChild(dot);
  } else {
    const b = document.createElement('span'); b.className = 'badge ' + badgeClass;
    b.textContent = badgeText; row.appendChild(b);
  }
  const lbl = document.createElement('span'); lbl.className = 'label'; lbl.textContent = label;
  row.appendChild(lbl);
  const val = document.createElement('span'); val.className = 'value'; val.textContent = value;
  row.appendChild(val);
  return row;
}

function initWithData(root, todayStr) {
  DATA = root;

  if (todayStr) {
    const dateEl = document.querySelector('.topbar .meta b');
    if (dateEl) dateEl.textContent = todayStr.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$1.$2.$3');
  }

  const stats = computeStats(DATA);
  document.getElementById('stat-total').textContent   = stats.total;
  document.getElementById('stat-active').textContent  = stats.active;
  document.getElementById('stat-leave').textContent   = stats.leave;
  document.getElementById('stat-joining').textContent = stats.joining;
  document.getElementById('stat-orgs').textContent    = stats.orgs;

  const posContainer = document.getElementById('stats-position');
  posContainer.innerHTML = '';
  [
    ['L','L','리더급'],
    ['S','S','Sr.매니저'],
    ['M','M','매니저'],
    ['PA','PA','스페셜리스트'],
    ['ASSIST','어시','어시스턴트'],
    ['JINT','(전)인턴','전환인턴'],
    ['DINT','(단)인턴','단기인턴'],
    ['PT','PT','시간제근로자'],
  ].forEach(([cls, badge, label]) => {
    const key = (badge === 'L') ? 'L' : badge;
    posContainer.appendChild(statRow(cls, badge, label, stats.position[key] || 0, 'code'));
  });

  const contractContainer = document.getElementById('stats-contract');
  contractContainer.innerHTML = '';
  [['정규직'],['계약직'],['파견직']].forEach(([label]) => {
    contractContainer.appendChild(statRow('grey', '', label, stats.contract[label] || 0, 'dot'));
  });
  if (stats.contract['기타'] > 0) {
    contractContainer.appendChild(statRow('regular','','기타',stats.contract['기타'],'dot'));
  }
  if (stats.joining > 0) {
    contractContainer.appendChild(statRow('joining','','입사예정',stats.joining,'dot'));
  }

  const genderContainer = document.getElementById('stats-gender');
  genderContainer.innerHTML = '';
  [['female','여성'],['male','남성']].forEach(([cls, label]) => {
    genderContainer.appendChild(statRow(cls, '', label, stats.gender[label] || 0, 'dot'));
  });
  if (stats.gender['미지정'] > 0) {
    genderContainer.appendChild(statRow('regular','','미지정',stats.gender['미지정'],'dot'));
  }

  renderTree(DATA);
}

// 초기화: static(baked) 또는 dynamic(fetch)
if (_BAKED !== null) {
  initWithData(_BAKED, null);
  document.getElementById('loading-overlay').style.display = 'none';
} else {
  fetch(APPS_SCRIPT_URL)
    .then(r => r.json())
    .then(res => {
      if (!res.success) throw new Error(res.error || '알 수 없는 오류');
      initWithData(res.data.tree, res.data.today);
      document.getElementById('loading-overlay').style.display = 'none';
    })
    .catch(err => {
      const ov = document.getElementById('loading-overlay');
      ov.innerHTML = '<div class="loading-error">데이터 로드 실패: ' + err.message + '<br>페이지를 새로고침하거나 관리자에게 문의하세요.</div>';
    });
}

let _matchedNodes = [];
let _matchIdx = 0;

function scrollToMatchNode(node) {
  const x = parseFloat(node.style.left) || 0;
  const y = parseFloat(node.style.top) || 0;
  const nw = node.offsetWidth * zoom;
  const nh = node.offsetHeight * zoom;
  const pad = 30;
  canvasEl.scrollTo({
    left: x * zoom + pad - (canvasEl.clientWidth  - nw) / 2,
    top:  y * zoom + pad - (canvasEl.clientHeight - nh) / 2,
    behavior: 'smooth'
  });
}

const searchEl = document.getElementById('search');
searchEl.addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const nodes = document.querySelectorAll('.node');
  nodes.forEach(n => n.classList.remove('dimmed','highlight'));
  document.querySelectorAll('.person-row').forEach(r => r.classList.remove('match'));
  _matchedNodes = []; _matchIdx = 0;
  if (!q) return;
  nodes.forEach(n => {
    const org = (n.dataset.org || '').toLowerCase();
    let matched = org.includes(q);
    n.querySelectorAll('.child-section-header').forEach(h => {
      if ((h.dataset.childOrg || '').toLowerCase().includes(q)) matched = true;
    });
    n.querySelectorAll('.person-row').forEach(r => {
      const nm = (r.dataset.name || '').toLowerCase();
      if (nm.includes(q)) { matched = true; r.classList.add('match'); }
    });
    if (matched) { n.classList.add('highlight'); _matchedNodes.push(n); }
    else n.classList.add('dimmed');
  });
  if (_matchedNodes.length > 0) scrollToMatchNode(_matchedNodes[0]);
});

searchEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && _matchedNodes.length > 1) {
    _matchIdx = (_matchIdx + 1) % _matchedNodes.length;
    scrollToMatchNode(_matchedNodes[_matchIdx]);
  }
});

let zoom = 1;
const treeEl   = document.getElementById('tree');
const canvasEl = document.getElementById('canvas');
const zoomLabel = document.getElementById('zoom-label');
function applyZoom() { treeEl.style.zoom = zoom; zoomLabel.textContent = Math.round(zoom*100)+'%'; }
document.getElementById('zoom-in').onclick  = () => { zoom = Math.min(zoom+0.1, 3); applyZoom(); };
document.getElementById('zoom-out').onclick = () => { zoom = Math.max(zoom-0.1, 0.2); applyZoom(); };
document.getElementById('zoom-fit').onclick = () => {
  treeEl.style.zoom = 1;
  const tw = treeEl.scrollWidth, th = treeEl.scrollHeight;
  const cw = canvasEl.clientWidth-60, ch = canvasEl.clientHeight-60;
  zoom = Math.min(cw/tw, ch/th, 1);
  applyZoom();
};
canvasEl.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    zoom = Math.max(0.2, Math.min(3, zoom + (e.deltaY < 0 ? 0.05 : -0.05)));
    applyZoom();
  }
}, { passive: false });
applyZoom();

document.querySelectorAll('.stat-header').forEach(h => {
  h.addEventListener('click', () => {
    const target = document.getElementById(h.dataset.target);
    const collapsed = target.classList.toggle('collapsed');
    h.classList.toggle('collapsed', collapsed);
  });
});

document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('hidden');
});

/* ── 탭 전환 ── */
(function() {
  var _editInitialized = false;

  function enterEditMode() {
    document.body.classList.add('edit-mode');
    document.getElementById('version-wrap').style.display = 'flex';
    if (!_editInitialized) {
      initDraftModule();
      _editInitialized = true;
    } else if (window._draftInitAll) {
      window._draftInitAll();
    }
  }
  function exitEditMode() {
    document.body.classList.remove('edit-mode');
    document.getElementById('version-wrap').style.display = 'none';
  }

  document.getElementById('tab-view').addEventListener('click', function() {
    document.getElementById('tab-view').classList.add('active');
    document.getElementById('tab-edit').classList.remove('active');
    exitEditMode();
  });
  document.getElementById('tab-edit').addEventListener('click', function() {
    document.getElementById('tab-edit').classList.add('active');
    document.getElementById('tab-view').classList.remove('active');
    enterEditMode();
  });
})();

/* ── 편집 모드 모듈 ── */
function initDraftModule() {
(function() {
  var CODE_D = {
    'Sr.매니저':'S','매니저':'M','스페셜리스트':'PA',
    '어시스턴트':'어시','전환인턴':'(전)인턴','단기인턴':'(단)인턴','시간제근로자':'PT'
  };
  var LEADER_D = new Set(['팀 리더','(임)팀 리더','(임) 팀 리더','파트 리더','(임) 파트 리더',
    '본부 리더','(임) 본부 리더','실 리더','TF 리더','(임) TF 리더','COO','CMO']);

  var changes = { removes:[], moves:[], adds:[], rename_org:[], org_removes:[], org_moves:[], org_adds:[] };
  var originalDATA = JSON.parse(JSON.stringify(DATA));
  var dragSrc = null;

  function byOrg(n)  { return Array.from(document.querySelectorAll('.node')).find(function(el){ return el.dataset.org===n; })||null; }
  function byName(n) { return Array.from(document.querySelectorAll('.person-row')).find(function(el){ return el.dataset.name===n; })||null; }

  /* ── DATA 조작 후 전체 재렌더 ── */
  function findNodeInTree(root, name) {
    if (root.name === name) return root;
    for (var i = 0; i < (root.children || []).length; i++) {
      var f = findNodeInTree(root.children[i], name);
      if (f) return f;
    }
    return null;
  }
  function findParentInTree(root, name) {
    var children = root.children || [];
    if (children.some(function(c) { return c.name === name; })) return root;
    for (var i = 0; i < children.length; i++) {
      var f = findParentInTree(children[i], name);
      if (f) return f;
    }
    return null;
  }

  function applyChangesToData(root, chgs) {
    function allNodes(nd, out) {
      out.push(nd);
      (nd.children || []).forEach(function(c) { allNodes(c, out); });
      return out;
    }
    chgs.removes.forEach(function(item) {
      allNodes(root, []).forEach(function(nd) {
        nd.leaders = (nd.leaders || []).filter(function(p) { return p.name !== item.person; });
        nd.members = (nd.members || []).filter(function(p) { return p.name !== item.person; });
      });
    });
    chgs.moves.forEach(function(item) {
      var person = null;
      allNodes(root, []).forEach(function(nd) {
        ['leaders','members'].forEach(function(lst) {
          if (person) return;
          var arr = nd[lst] || [];
          var idx = arr.findIndex(function(p) { return p.name === item.person; });
          if (idx >= 0) { person = arr.splice(idx, 1)[0]; }
        });
      });
      var dest = findNodeInTree(root, item.to);
      if (person && dest) { dest.members = dest.members || []; dest.members.push(person); }
    });
    chgs.adds.forEach(function(item) {
      var nd = findNodeInTree(root, item.org);
      if (!nd) return;
      var isLdr = LEADER_D.has(item.title);
      var p = { name:item.name, code:isLdr?'':(CODE_D[item.title]||item.title),
                contract_tag:'', kind:isLdr?item.title:null, raw_pos:item.title,
                contract:item.contract||'정규직', gender:'', leave:null, joining:null, geum:false, retiring:null };
      if (isLdr) { nd.leaders = nd.leaders||[]; nd.leaders.push(p); }
      else       { nd.members = nd.members||[]; nd.members.push(p); }
    });
    chgs.org_removes.forEach(function(item) {
      var par = findParentInTree(root, item.org);
      if (par) par.children = (par.children||[]).filter(function(c){ return c.name!==item.org; });
    });
    chgs.rename_org.forEach(function(item) {
      var nd = findNodeInTree(root, item.from);
      if (nd) nd.short_name = item.to;
    });
    chgs.org_moves.forEach(function(item) {
      var par = findParentInTree(root, item.org);
      var nd  = findNodeInTree(root, item.org);
      if (!nd) return;
      if (par) par.children = (par.children||[]).filter(function(c){ return c.name!==item.org; });
      var newPar = findNodeInTree(root, item.to_parent);
      if (newPar) { newPar.children = newPar.children||[]; newPar.children.push(nd); }
    });
    chgs.org_adds.forEach(function(item) {
      var par = findNodeInTree(root, item.parent);
      if (par) {
        par.children = par.children||[];
        par.children.push({ name:item.org, short_name:item.org, direct:0, total:0, leaders:[], members:[], children:[] });
      }
    });
    function recount(nd) {
      (nd.children||[]).forEach(recount);
      nd.direct = ((nd.leaders||[]).length + (nd.members||[]).length);
      nd.total  = nd.direct + (nd.children||[]).reduce(function(s,c){ return s+(c.total||0); },0);
    }
    recount(root);
  }

  function rerender() {
    var treeEl = document.getElementById('tree');
    var svgEl  = document.getElementById('svg');
    Array.from(treeEl.querySelectorAll('.node')).forEach(function(n){ n.remove(); });
    while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
    var newRoot = JSON.parse(JSON.stringify(originalDATA));
    applyChangesToData(newRoot, changes);
    renderTree(newRoot);
    if (document.body.classList.contains('edit-mode')) initAll();
  }

  /* ── 삽입 위치 계산 ── */
  function getInsertBefore(card, clientY) {
    var rows = Array.from(card.querySelectorAll('.person-row:not(.dragging)'));
    for (var i = 0; i < rows.length; i++) {
      var rect = rows[i].getBoundingClientRect();
      if (clientY < rect.top + rect.height / 2) return rows[i];
    }
    return null;
  }
  function showInsertLine(card, beforeRow) {
    card.querySelectorAll('.draft-insert-line').forEach(function(l){ l.remove(); });
    if (!dragSrc) return;
    var line = document.createElement('div');
    line.className = 'draft-insert-line';
    var addRow = card.querySelector('.draft-add-row');
    var ref = beforeRow || addRow || null;
    if (ref) card.insertBefore(line, ref); else card.appendChild(line);
  }

  /* ── 카드 초기화 ── */
  function initCard(card) {
    var orgName = card.dataset.org;
    if (!orgName) return;
    if (card.querySelector('.draft-card-controls')) return;

    var nameEl = card.querySelector('.head .name');
    if (nameEl) {
      (function(el, org) { el.ondblclick = function(){ startRename(card, el, org); }; })(nameEl, orgName);
    }
    var head = card.querySelector('.head');
    if (head) {
      var ctrls = document.createElement('div');
      ctrls.className = 'draft-card-controls';
      var rmBtn = document.createElement('button');
      rmBtn.className = 'draft-card-btn cb-remove'; rmBtn.textContent = '\xd7 삭제';
      (function(org,c){ rmBtn.onclick = function(e){ e.stopPropagation(); doRemoveOrg(org,c); }; })(orgName, card);
      ctrls.appendChild(rmBtn);
      var mvBtn = document.createElement('button');
      mvBtn.className = 'draft-card-btn cb-move'; mvBtn.textContent = '→ 이동';
      (function(org,c){ mvBtn.onclick = function(e){ e.stopPropagation(); openOrgModal('move',org,c); }; })(orgName, card);
      ctrls.appendChild(mvBtn);
      var addOBtn = document.createElement('button');
      addOBtn.className = 'draft-card-btn cb-add'; addOBtn.textContent = '+ 하위조직';
      (function(org){ addOBtn.onclick = function(e){ e.stopPropagation(); openOrgModal('add',org,null); }; })(orgName);
      ctrls.appendChild(addOBtn);
      head.appendChild(ctrls);
    }
    var addRow = document.createElement('div');
    addRow.className = 'draft-add-row';
    addRow.textContent = '+ 인원 추가';
    (function(org){ addRow.onclick = function(){ openModal(org); }; })(orgName);
    card.appendChild(addRow);

    card.addEventListener('dragover', function(e) {
      if (!dragSrc) return; e.preventDefault();
      card.classList.add('drag-over');
      showInsertLine(card, getInsertBefore(card, e.clientY));
    });
    card.addEventListener('dragleave', function(e) {
      if (!card.contains(e.relatedTarget)) {
        card.classList.remove('drag-over');
        card.querySelectorAll('.draft-insert-line').forEach(function(l){ l.remove(); });
      }
    });
    card.addEventListener('drop', function(e) {
      e.preventDefault(); card.classList.remove('drag-over');
      var before = getInsertBefore(card, e.clientY);
      card.querySelectorAll('.draft-insert-line').forEach(function(l){ l.remove(); });
      if (dragSrc) doMove(dragSrc, orgName, card, before);
    });
  }

  function initRow(row, orgName) {
    var name = row.dataset.name; if (!name) return;
    if (!row.querySelector('.draft-remove')) {
      var rmBtn = document.createElement('span');
      rmBtn.className = 'draft-remove'; rmBtn.textContent = '\xd7'; rmBtn.title = '제거';
      (function(n,r){ rmBtn.onclick = function(e){ e.stopPropagation(); doRemove(n,r); }; })(name, row);
      row.appendChild(rmBtn);
    }
    row.draggable = true;
    row.addEventListener('dragstart', function(e) {
      dragSrc = { name:name, org:orgName, row:row };
      row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', function() { row.classList.remove('dragging'); dragSrc = null; });
  }

  function initAll() {
    document.querySelectorAll('.node').forEach(function(card) {
      initCard(card);
      var org = card.dataset.org;
      card.querySelectorAll('.person-row').forEach(function(row){ initRow(row, org); });
    });
  }

  /* ── 편집 동작 ── */
  function doRemove(name, row) {
    changes.removes.push({ person:name }); row.style.display = 'none'; bump();
  }
  function doMove(src, toOrg, toCard, beforeRow) {
    var addRow = toCard.querySelector('.draft-add-row');
    var ref = beforeRow || addRow || null;
    if (ref) toCard.insertBefore(src.row, ref); else toCard.appendChild(src.row);
    initRow(src.row, toOrg);
    changes.moves.push({ person:src.name, from:src.org, to:toOrg }); bump();
  }

  /* ── 조직 동작 ── */
  function doRemoveOrg(orgName, card) {
    if (!confirm('"' + orgName + '" 조직을 삭제하시겠습니까?\n(소속 인원도 함께 제거됩니다)')) return;
    changes.org_removes.push({ org:orgName }); bump(); rerender();
  }

  var _orgModalMode = null, _orgModalOrg = null, _orgModalCard = null;
  function openOrgModal(mode, orgName, card) {
    _orgModalMode = mode; _orgModalOrg = orgName; _orgModalCard = card;
    var m = document.getElementById('draft-org-modal');
    var titleEl = document.getElementById('draft-org-modal-title');
    var labelEl = document.getElementById('draft-org-modal-label');
    var input   = document.getElementById('draft-org-input');
    if (mode === 'move') {
      titleEl.textContent = orgName + ' 이동';
      labelEl.textContent = '이동할 상위 조직명';
      input.value = ''; input.placeholder = '예: 브랜드HQ';
    } else {
      titleEl.textContent = orgName + ' 하위 조직 추가';
      labelEl.textContent = '새 조직명';
      input.value = ''; input.placeholder = '예: 신규팀';
    }
    m.style.display = 'flex';
    setTimeout(function(){ input.focus(); }, 40);
  }
  function closeOrgModal() { document.getElementById('draft-org-modal').style.display = 'none'; }

  function confirmOrgModal() {
    var val = document.getElementById('draft-org-input').value.trim();
    if (!val) { document.getElementById('draft-org-input').focus(); return; }
    if (_orgModalMode === 'move') {
      var testRoot = JSON.parse(JSON.stringify(originalDATA));
      applyChangesToData(testRoot, changes);
      if (!findNodeInTree(testRoot, val)) {
        alert('"' + val + '" 조직을 찾을 수 없습니다.');
        return;
      }
      changes.org_moves.push({ org:_orgModalOrg, to_parent:val });
    } else {
      changes.org_adds.push({ org:val, parent:_orgModalOrg });
    }
    bump(); closeOrgModal(); rerender();
  }

  function startRename(card, nameEl, orgName) {
    var old = nameEl.textContent.trim();
    var input = document.createElement('input');
    input.className = 'draft-rename-input'; input.value = old;
    nameEl.textContent = ''; nameEl.appendChild(input);
    input.focus(); input.select();
    function finish() {
      var nv = input.value.trim() || old; nameEl.textContent = nv;
      (function(el,org){ el.ondblclick = function(){ startRename(card,el,org); }; })(nameEl, orgName);
      if (nv !== old) { changes.rename_org.push({ from:orgName, to:nv }); bump(); }
    }
    input.onblur = finish;
    input.onkeydown = function(e) {
      if (e.key==='Enter') input.blur();
      if (e.key==='Escape') { input.value=old; input.blur(); }
    };
  }

  /* ── 인원 추가 모달 ── */
  function openModal(orgName) {
    var m = document.getElementById('draft-modal');
    m.dataset.org = orgName;
    document.getElementById('draft-modal-org').textContent = orgName;
    document.getElementById('draft-new-name').value = '';
    m.style.display = 'flex';
    setTimeout(function(){ document.getElementById('draft-new-name').focus(); }, 40);
  }
  function closeModal() { document.getElementById('draft-modal').style.display = 'none'; }

  function confirmAdd() {
    var orgName  = document.getElementById('draft-modal').dataset.org;
    var name     = document.getElementById('draft-new-name').value.trim();
    var title    = document.getElementById('draft-new-title').value;
    var contract = document.getElementById('draft-new-contract').value;
    if (!name) { document.getElementById('draft-new-name').focus(); return; }
    var isLdr = LEADER_D.has(title);
    var code  = CODE_D[title] || title;
    var cc    = contract==='계약직'?'contract':contract==='파견직'?'dispatch':'regular';
    var row   = document.createElement('div');
    row.className = 'person-row ' + (isLdr?'leader':'member') + ' ' + cc;
    row.dataset.name = name;
    if (isLdr) {
      var role = document.createElement('span'); role.className = 'role'; role.textContent = title;
      row.appendChild(role);
    } else {
      var codeEl = document.createElement('span'); codeEl.className = 'code';
      codeEl.dataset.code = code; codeEl.textContent = code; row.appendChild(codeEl);
    }
    var nameEl = document.createElement('span'); nameEl.className = 'name';
    nameEl.textContent = name; nameEl.title = name; row.appendChild(nameEl);
    var card = byOrg(orgName);
    if (card) {
      var addRow = card.querySelector('.draft-add-row');
      if (addRow) card.insertBefore(row, addRow); else card.appendChild(row);
      initRow(row, orgName);
    }
    changes.adds.push({ name:name, org:orgName, title:title, contract:contract });
    bump(); closeModal();
  }

  /* ── 저장 ── */
  function saveDraft() {
    /* changes를 originalDATA에 영구 반영 */
    applyChangesToData(originalDATA, changes);
    changes = { removes:[], moves:[], adds:[], rename_org:[], org_removes:[], org_moves:[], org_adds:[] };
    /* 트리 재렌더 (편집 컨트롤 없이) */
    var treeEl = document.getElementById('tree');
    var svgEl  = document.getElementById('svg');
    Array.from(treeEl.querySelectorAll('.node')).forEach(function(n){ n.remove(); });
    while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
    renderTree(JSON.parse(JSON.stringify(originalDATA)));
    /* 조직도 탭으로 전환 */
    document.getElementById('tab-view').click();
    /* 편집 탭 레이블을 버전명으로 변경 */
    var vname = (document.getElementById('version-name').value || '').trim();
    if (vname) {
      document.getElementById('tab-edit').textContent = vname;
      document.getElementById('tab-edit').dataset.vname = vname;
    }
  }

  function bump() {}  /* no-op: 내보내기 카운터 제거됨 */

  function resetDraft() {
    var total = changes.removes.length + changes.moves.length + changes.adds.length +
                changes.rename_org.length + changes.org_removes.length + changes.org_moves.length + changes.org_adds.length;
    if (total > 0 && !confirm('변경사항 ' + total + '개를 모두 초기화하시겠습니까?')) return;
    changes = { removes:[], moves:[], adds:[], rename_org:[], org_removes:[], org_moves:[], org_adds:[] };
    rerender();
  }

  /* ── 이벤트 연결 ── */
  document.getElementById('draft-save').onclick  = saveDraft;
  document.getElementById('draft-reset').onclick = resetDraft;
  document.getElementById('draft-modal-confirm').onclick = confirmAdd;
  document.getElementById('draft-modal-cancel').onclick  = closeModal;
  document.getElementById('draft-modal').onclick = function(e){ if(e.target===document.getElementById('draft-modal')) closeModal(); };
  document.getElementById('draft-new-name').onkeydown = function(e){ if(e.key==='Enter') confirmAdd(); if(e.key==='Escape') closeModal(); };
  document.getElementById('draft-org-confirm').onclick = confirmOrgModal;
  document.getElementById('draft-org-cancel').onclick  = closeOrgModal;
  document.getElementById('draft-org-modal').onclick = function(e){ if(e.target===document.getElementById('draft-org-modal')) closeOrgModal(); };
  document.getElementById('draft-org-input').onkeydown = function(e){ if(e.key==='Enter') confirmOrgModal(); if(e.key==='Escape') closeOrgModal(); };

  initAll();
  window._draftInitAll = initAll;
  window._draftRerender = rerender;
})();
}
</script>
